<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <linearGradient id="blueNode" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#3D5FA8"/>
      <stop offset="100%" stop-color="#7B6CB5"/>
    </linearGradient>

    <linearGradient id="goldNode" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#C4920D"/>
      <stop offset="100%" stop-color="#E0B030"/>
    </linearGradient>

    <linearGradient id="greenNode" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#2D6B2D"/>
      <stop offset="100%" stop-color="#5A9A5A"/>
    </linearGradient>

    <filter id="glowTeal" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowBlue" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowGold" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowGreen" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle ambient glow behind the constellation -->
  <circle cx="900" cy="315" r="200" fill="#0d9488" opacity="0.04" filter="url(#softGlow)"/>
  <circle cx="900" cy="315" r="120" fill="#7B6CB5" opacity="0.06" filter="url(#softGlow)"/>

  <!-- Grid lines (very subtle) -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
  </g>

  <!-- === CONSTELLATION (right side, scaled up from logo) === -->
  <g transform="translate(900, 315) scale(2.2)">
    <!-- Connection lines: Tier 1 → Tier 2 -->
    <line x1="0" y1="-28" x2="26" y2="-45" stroke="#6B7BB8" stroke-width="1.1" stroke-opacity="0.55"/>
    <line x1="0" y1="-28" x2="-45" y2="-26" stroke="#6B7BB8" stroke-width="1.1" stroke-opacity="0.55"/>
    <line x1="24" y1="14" x2="45" y2="26" stroke="#6B7BB8" stroke-width="1.1" stroke-opacity="0.55"/>
    <line x1="24" y1="14" x2="-26" y2="45" stroke="#6B7BB8" stroke-width="1.1" stroke-opacity="0.55"/>
    <line x1="-24" y1="14" x2="-45" y2="-26" stroke="#6B7BB8" stroke-width="1.1" stroke-opacity="0.55"/>
    <line x1="-24" y1="14" x2="-26" y2="45" stroke="#6B7BB8" stroke-width="1.1" stroke-opacity="0.55"/>

    <!-- Connection lines: Tier 2 → Tier 3 -->
    <line x1="26" y1="-45" x2="0" y2="-74" stroke="#9A8A30" stroke-width="1.0" stroke-opacity="0.5"/>
    <line x1="26" y1="-45" x2="64" y2="-37" stroke="#9A8A30" stroke-width="1.0" stroke-opacity="0.5"/>
    <line x1="45" y1="26" x2="64" y2="37" stroke="#9A8A30" stroke-width="1.0" stroke-opacity="0.5"/>
    <line x1="-26" y1="45" x2="0" y2="74" stroke="#9A8A30" stroke-width="1.0" stroke-opacity="0.5"/>
    <line x1="-26" y1="45" x2="-64" y2="37" stroke="#9A8A30" stroke-width="1.0" stroke-opacity="0.5"/>
    <line x1="-45" y1="-26" x2="-64" y2="-37" stroke="#9A8A30" stroke-width="1.0" stroke-opacity="0.5"/>

    <!-- Lateral mesh: Tier 3 -->
    <line x1="0" y1="-74" x2="64" y2="-37" stroke="#4A7A4A" stroke-width="0.7" stroke-opacity="0.3" stroke-dasharray="3 3"/>
    <line x1="64" y1="-37" x2="64" y2="37" stroke="#4A7A4A" stroke-width="0.7" stroke-opacity="0.3" stroke-dasharray="3 3"/>
    <line x1="64" y1="37" x2="0" y2="74" stroke="#4A7A4A" stroke-width="0.7" stroke-opacity="0.3" stroke-dasharray="3 3"/>
    <line x1="0" y1="74" x2="-64" y2="37" stroke="#4A7A4A" stroke-width="0.7" stroke-opacity="0.3" stroke-dasharray="3 3"/>
    <line x1="-64" y1="37" x2="-64" y2="-37" stroke="#4A7A4A" stroke-width="0.7" stroke-opacity="0.3" stroke-dasharray="3 3"/>
    <line x1="-64" y1="-37" x2="0" y2="-74" stroke="#4A7A4A" stroke-width="0.7" stroke-opacity="0.3" stroke-dasharray="3 3"/>

    <!-- Cross-scale skip connections -->
    <line x1="24" y1="14" x2="64" y2="37" stroke="#557766" stroke-width="0.7" stroke-opacity="0.28" stroke-dasharray="2 3"/>
    <line x1="0" y1="-28" x2="0" y2="-74" stroke="#557766" stroke-width="0.7" stroke-opacity="0.28" stroke-dasharray="2 3"/>
    <line x1="-24" y1="14" x2="-64" y2="37" stroke="#557766" stroke-width="0.7" stroke-opacity="0.28" stroke-dasharray="2 3"/>

    <!-- Tier 1 nodes (blue-purple, small) -->
    <circle cx="0" cy="-28" r="3.5" fill="url(#blueNode)" filter="url(#glowBlue)"/>
    <circle cx="24" cy="14" r="3.5" fill="url(#blueNode)" filter="url(#glowBlue)"/>
    <circle cx="-24" cy="14" r="3.5" fill="url(#blueNode)" filter="url(#glowBlue)"/>

    <!-- Tier 2 nodes (gold, medium) -->
    <circle cx="26" cy="-45" r="5.5" fill="url(#goldNode)" filter="url(#glowGold)"/>
    <circle cx="45" cy="26" r="5.5" fill="url(#goldNode)" filter="url(#glowGold)"/>
    <circle cx="-26" cy="45" r="5.5" fill="url(#goldNode)" filter="url(#glowGold)"/>
    <circle cx="-45" cy="-26" r="5.5" fill="url(#goldNode)" filter="url(#glowGold)"/>

    <!-- Tier 3 nodes (green, large) -->
    <circle cx="0" cy="-74" r="7.5" fill="url(#greenNode)" filter="url(#glowGreen)"/>
    <circle cx="64" cy="-37" r="7.5" fill="url(#greenNode)" filter="url(#glowGreen)"/>
    <circle cx="64" cy="37" r="7.5" fill="url(#greenNode)" filter="url(#glowGreen)"/>
    <circle cx="0" cy="74" r="7.5" fill="url(#greenNode)" filter="url(#glowGreen)"/>
    <circle cx="-64" cy="37" r="7.5" fill="url(#greenNode)" filter="url(#glowGreen)"/>
    <circle cx="-64" cy="-37" r="7.5" fill="url(#greenNode)" filter="url(#glowGreen)"/>
  </g>

  <!-- === TEXT (left side) === -->

  <!-- Teal accent line -->
  <rect x="80" y="175" width="60" height="3" rx="1.5" fill="url(#tealAccent)"/>

  <!-- Badge -->
  <text x="80" y="210" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0d9488" letter-spacing="0.1em" text-transform="uppercase">GLOBAL GOVERNANCE FRAMEWORKS</text>

  <!-- Title -->
  <text x="80" y="275" font-family="Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#f1f5f9">The Fractal</text>
  <text x="80" y="335" font-family="Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#f1f5f9">Intelligence Accord</text>

  <!-- Subtitle -->
  <text x="80" y="390" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="300" fill="#94a3b8">AGI Governance for Human Meaning</text>

  <!-- Teal divider -->
  <rect x="80" y="415" width="400" height="1" fill="#0d9488" opacity="0.4"/>

  <!-- Description lines -->
  <text x="80" y="450" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">Compute subsidiarity · Contextual intelligence</text>
  <text x="80" y="475" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">Cognitive sovereignty · Phased transition protocol</text>

  <!-- URL -->
  <text x="80" y="560" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">globalgovernanceframeworks.org</text>
</svg>
