<svg width="100%" height="100%" viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <style>
      .edge { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .edge-dashed { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 6 6; }
      .label { fill: #94a3b8; font-size: 12px; font-weight: 500; text-anchor: middle; }
      .node-text { fill: #ffffff; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .node-subtext { fill: #e2e8f0; font-size: 11px; text-anchor: middle; }
    </style>
  </defs>

  <path class="edge" d="M 500 120 L 500 200" marker-end="url(#arrow)" />
  <text x="500" y="160" class="label" fill="#cbd5e1" style="transform: translateX(10px);">Moral Veto / Oversight</text>

  <path class="edge" d="M 250 240 L 350 240" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="300" y="230" class="label">Legal Enforcement</text>

  <path class="edge" d="M 750 240 L 650 240" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="700" y="230" class="label">Policy &amp; Budget</text>

  <path class="edge" d="M 500 480 L 500 280" marker-end="url(#arrow)" />
  <text x="500" y="380" class="label" style="transform: translateX(10px);">Delegates / Bottom-Up Power</text>

  <path class="edge" d="M 800 280 Q 800 520 700 520" marker-end="url(#arrow)" />
  <text x="800" y="400" class="label" style="transform: translateX(10px);">AUBI &amp; Global Commons Fund</text>

  <path class="edge" d="M 200 280 Q 200 520 300 520" marker-end="url(#arrow)" />
  <text x="200" y="400" class="label" style="transform: translateX(-10px);">Rights Enforcement</text>

  <path class="edge" d="M 325 380 L 400 280" marker-end="url(#arrow)" />
  <text x="350" y="320" class="label">20-30% Voting Bloc</text>

  <path class="edge" d="M 675 380 L 600 280" marker-end="url(#arrow)" />
  <text x="650" y="320" class="label">Suspensive Veto</text>

  <path class="edge-dashed" d="M 500 70 L 650 140" marker-end="url(#arrow)" />
  <text x="600" y="90" class="label">Advisory Wisdom</text>

  <g transform="translate(500, 80)">
    <rect x="-120" y="-40" width="240" height="80" rx="15" fill="#166534" stroke="#4ade80" stroke-width="2"/>
    <text y="-5" class="node-text">Earth Council</text>
    <text y="15" class="node-subtext">Highest Moral Authority &amp; FPIC</text>
  </g>

  <g transform="translate(750, 80)">
    <rect x="-100" y="-35" width="200" height="70" rx="15" fill="#312e81" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4"/>
    <text y="-5" class="node-text">GCRSD</text>
    <text y="15" class="node-subtext">Religious &amp; Spiritual Advisory</text>
  </g>

  <g transform="translate(500, 240)">
    <rect x="-150" y="-40" width="300" height="80" rx="15" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text y="-5" class="node-text">Meta-Governance Councils</text>
    <text y="15" class="node-subtext">Health, Social, Cultural, Labor, Frontier</text>
  </g>

  <g transform="translate(200, 240)">
    <rect x="-100" y="-40" width="200" height="80" rx="15" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
    <text y="-5" class="node-text">Treaty / Justice System</text>
    <text y="15" class="node-subtext">Digital Justice Tribunal</text>
  </g>

  <g transform="translate(800, 240)">
    <rect x="-100" y="-40" width="200" height="80" rx="15" fill="#854d0e" stroke="#facc15" stroke-width="2"/>
    <text y="-5" class="node-text">Financial Systems</text>
    <text y="15" class="node-subtext">Global Commons Fund &amp; Hearts</text>
  </g>

  <g transform="translate(300, 400)">
    <rect x="-90" y="-35" width="180" height="70" rx="35" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
    <text y="-5" class="node-text">Youth Caucus</text>
    <text y="15" class="node-subtext">Horizon Protocol / IIA Audits</text>
  </g>

  <g transform="translate(700, 400)">
    <rect x="-90" y="-35" width="180" height="70" rx="35" fill="#9a3412" stroke="#fb923c" stroke-width="2"/>
    <text y="-5" class="node-text">Global Disability Alliance</text>
    <text y="15" class="node-subtext">Foundation Protocol / DCIAs</text>
  </g>

  <g transform="translate(500, 520)">
    <rect x="-200" y="-40" width="400" height="80" rx="10" fill="#3f3f46" stroke="#a1a1aa" stroke-width="2"/>
    <text y="-5" class="node-text">Bioregional Autonomous Zones (BAZs)</text>
    <text y="15" class="node-subtext">Local Hubs: Bioregional Polis, Care Co-ops, Memorial Commons</text>
  </g>

  <g transform="translate(500, 640)">
    <rect x="-300" y="-30" width="600" height="60" rx="5" fill="#064e3b" stroke="#34d399" stroke-width="2" stroke-dasharray="8 4"/>
    <text y="5" class="node-text">Indigenous &amp; Traditional Knowledge Governance Framework</text>
    <text y="20" class="node-subtext">Foundational Jurisdiction &amp; FPIC 2.0 Safeguards</text>
  </g>
  
  <path class="edge-dashed" d="M 500 560 L 500 610" />
</svg>
