<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>

    <linearGradient id="outerRing" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#2B4B8C"/>
      <stop offset="100%" stop-color="#6B5CA5"/>
    </linearGradient>

    <linearGradient id="blueNode" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#3D5FA8"/>
      <stop offset="100%" stop-color="#7B6CB5"/>
    </linearGradient>

    <linearGradient id="goldNode" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#C4920D"/>
      <stop offset="100%" stop-color="#E0B030"/>
    </linearGradient>

    <linearGradient id="greenNode" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#2D6B2D"/>
      <stop offset="100%" stop-color="#5A9A5A"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

  </defs>

  <!-- ── Outer boundary ──────────────────────────────────────────── -->
  <circle cx="100" cy="100" r="93" fill="#f8f9fc" stroke="url(#outerRing)" stroke-width="2.5"/>

  <!-- ── Tier rings (dashed, showing scale levels) ──────────────── -->
  <!-- Tier 3: implementation/bioregional (outermost active ring) -->
  <circle cx="100" cy="100" r="74" fill="none" stroke="#4A7A4A" stroke-width="0.8"
    stroke-dasharray="3 3" stroke-opacity="0.35"/>

  <!-- Tier 2: coordination/operating -->
  <circle cx="100" cy="100" r="52" fill="none" stroke="#B8860B" stroke-width="0.8"
    stroke-dasharray="2.5 2.5" stroke-opacity="0.4"/>

  <!-- Tier 1: constitutional/foundational -->
  <circle cx="100" cy="100" r="28" fill="none" stroke="#4B6BAC" stroke-width="0.8"
    stroke-dasharray="2 2" stroke-opacity="0.5"/>

  <!-- ── Connection lines (polycentric — not hub-and-spoke) ─────── -->
  <!-- Tier 1 → Tier 2 -->
  <line x1="100" y1="72"  x2="126" y2="55"  stroke="#6B7BB8" stroke-width="0.9" stroke-opacity="0.5"/>
  <line x1="100" y1="72"  x2="55"  y2="74"  stroke="#6B7BB8" stroke-width="0.9" stroke-opacity="0.5"/>
  <line x1="124" y1="114" x2="145" y2="126" stroke="#6B7BB8" stroke-width="0.9" stroke-opacity="0.5"/>
  <line x1="76"  y1="114" x2="74"  y2="145" stroke="#6B7BB8" stroke-width="0.9" stroke-opacity="0.5"/>

  <!-- Tier 2 → Tier 3 -->
  <line x1="126" y1="55"  x2="100" y2="26"  stroke="#9A8A30" stroke-width="0.8" stroke-opacity="0.45"/>
  <line x1="126" y1="55"  x2="164" y2="63"  stroke="#9A8A30" stroke-width="0.8" stroke-opacity="0.45"/>
  <line x1="145" y1="126" x2="164" y2="137" stroke="#9A8A30" stroke-width="0.8" stroke-opacity="0.45"/>
  <line x1="74"  y1="145" x2="100" y2="174" stroke="#9A8A30" stroke-width="0.8" stroke-opacity="0.45"/>
  <line x1="74"  y1="145" x2="36"  y2="137" stroke="#9A8A30" stroke-width="0.8" stroke-opacity="0.45"/>
  <line x1="55"  y1="74"  x2="36"  y2="63"  stroke="#9A8A30" stroke-width="0.8" stroke-opacity="0.45"/>

  <!-- Cross-scale lateral (polycentric coordination across tiers) -->
  <line x1="124" y1="114" x2="164" y2="137" stroke="#557766" stroke-width="0.7" stroke-opacity="0.3" stroke-dasharray="2 2"/>
  <line x1="100" y1="72"  x2="100" y2="26"  stroke="#557766" stroke-width="0.7" stroke-opacity="0.3" stroke-dasharray="2 2"/>

  <!-- ── Tier 1 nodes — constitutional (blue-purple, r=28) ───────── -->
  <!-- A: 0°  → (100, 72) -->
  <circle cx="100" cy="72" r="5.5" fill="url(#blueNode)" filter="url(#glow)"/>
  <!-- B: 120° → (124, 114) -->
  <circle cx="124" cy="114" r="5.5" fill="url(#blueNode)" filter="url(#glow)"/>
  <!-- C: 240° → (76, 114) -->
  <circle cx="76"  cy="114" r="5.5" fill="url(#blueNode)" filter="url(#glow)"/>

  <!-- ── Tier 2 nodes — coordination (gold, r=52) ─────────────────── -->
  <!-- D: 30°  → (126, 55) -->
  <circle cx="126" cy="55"  r="5"   fill="url(#goldNode)" filter="url(#softglow)"/>
  <!-- E: 120° → (145, 126) -->
  <circle cx="145" cy="126" r="5"   fill="url(#goldNode)" filter="url(#softglow)"/>
  <!-- F: 210° → (74, 145) -->
  <circle cx="74"  cy="145" r="5"   fill="url(#goldNode)" filter="url(#softglow)"/>
  <!-- G: 300° → (55, 74) -->
  <circle cx="55"  cy="74"  r="5"   fill="url(#goldNode)" filter="url(#softglow)"/>

  <!-- ── Tier 3 nodes — bioregional/commons (green, r=74) ─────────── -->
  <!-- H: 0°   → (100, 26) -->
  <circle cx="100" cy="26"  r="4.5" fill="url(#greenNode)"/>
  <!-- I: 60°  → (164, 63) -->
  <circle cx="164" cy="63"  r="4.5" fill="url(#greenNode)"/>
  <!-- J: 120° → (164, 137) -->
  <circle cx="164" cy="137" r="4.5" fill="url(#greenNode)"/>
  <!-- K: 180° → (100, 174) -->
  <circle cx="100" cy="174" r="4.5" fill="url(#greenNode)"/>
  <!-- L: 240° → (36, 137) -->
  <circle cx="36"  cy="137" r="4.5" fill="url(#greenNode)"/>
  <!-- M: 300° → (36, 63) -->
  <circle cx="36"  cy="63"  r="4.5" fill="url(#greenNode)"/>

</svg>
