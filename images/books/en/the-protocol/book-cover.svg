<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Pattern for geometric mesh background -->
    <pattern id="meshPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="2" fill="#0ea5e9" opacity="0.3"/>
      <line x1="30" y1="30" x2="60" y2="30" stroke="#0ea5e9" stroke-width="0.5" opacity="0.2"/>
      <line x1="30" y1="30" x2="30" y2="60" stroke="#0ea5e9" stroke-width="0.5" opacity="0.2"/>
      <line x1="30" y1="30" x2="60" y2="60" stroke="#0ea5e9" stroke-width="0.5" opacity="0.2"/>
    </pattern>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main background -->
  <rect width="600" height="900" fill="url(#bgGradient)"/>
  
  <!-- Mesh pattern overlay -->
  <rect width="600" height="900" fill="url(#meshPattern)" opacity="0.5"/>
  
  <!-- Top accent bar -->
  <rect width="600" height="8" fill="url(#accentGradient)"/>
  
  <!-- Central globe/network visualization -->
  <g transform="translate(300, 280)">
    <!-- Outer orbital rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.3"/>
    
    <!-- Central globe -->
    <circle cx="0" cy="0" r="80" fill="#1e40af" opacity="0.6"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#accentGradient)" stroke-width="2"/>
    
    <!-- Network nodes on globe -->
    <circle cx="0" cy="-60" r="4" fill="#10b981" filter="url(#glow)"/>
    <circle cx="50" cy="-40" r="4" fill="#10b981" filter="url(#glow)"/>
    <circle cx="60" cy="0" r="4" fill="#10b981" filter="url(#glow)"/>
    <circle cx="40" cy="50" r="4" fill="#10b981" filter="url(#glow)"/>
    <circle cx="-40" cy="50" r="4" fill="#10b981" filter="url(#glow)"/>
    <circle cx="-60" cy="0" r="4" fill="#10b981" filter="url(#glow)"/>
    <circle cx="-50" cy="-40" r="4" fill="#10b981" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#10b981" filter="url(#glow)"/>
    
    <!-- Connection lines -->
    <line x1="0" y1="-60" x2="50" y2="-40" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <line x1="50" y1="-40" x2="60" y2="0" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <line x1="60" y1="0" x2="40" y2="50" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <line x1="40" y1="50" x2="-40" y2="50" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <line x1="-40" y1="50" x2="-60" y2="0" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <line x1="-60" y1="0" x2="-50" y2="-40" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <line x1="-50" y1="-40" x2="0" y2="-60" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    
    <!-- Additional cross-connections -->
    <line x1="0" y1="0" x2="0" y2="-60" stroke="#0ea5e9" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="60" y2="0" stroke="#0ea5e9" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="-60" y2="0" stroke="#0ea5e9" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="40" y2="50" stroke="#0ea5e9" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="-40" y2="50" stroke="#0ea5e9" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- Title section -->
  <g transform="translate(300, 520)">
    <!-- "THE" -->
    <text 
      text-anchor="middle" 
      x="0" 
      y="0" 
      font-family="'Helvetica Neue', Arial, sans-serif" 
      font-size="32" 
      font-weight="300" 
      letter-spacing="8"
      fill="#e0f2fe">
      THE
    </text>
    
    <!-- "PROTOCOL" -->
    <text 
      text-anchor="middle" 
      x="0" 
      y="60" 
      font-family="'Helvetica Neue', Arial, sans-serif" 
      font-size="72" 
      font-weight="700" 
      letter-spacing="4"
      fill="#ffffff">
      PROTOCOL
    </text>
    
    <!-- Accent line -->
    <line x1="-150" y1="80" x2="150" y2="80" stroke="url(#accentGradient)" stroke-width="3"/>
    
    <!-- Subtitle -->
    <text 
      text-anchor="middle" 
      x="0" 
      y="120" 
      font-family="'Helvetica Neue', Arial, sans-serif" 
      font-size="24" 
      font-weight="400" 
      letter-spacing="2"
      fill="#bae6fd">
      A POCKET GUIDE TO
    </text>
    
    <text 
      text-anchor="middle" 
      x="0" 
      y="150" 
      font-family="'Helvetica Neue', Arial, sans-serif" 
      font-size="24" 
      font-weight="400" 
      letter-spacing="2"
      fill="#bae6fd">
      PLANETARY GOVERNANCE
    </text>
  </g>
  
  <!-- Key concepts badges -->
  <g transform="translate(300, 720)">
    <!-- Left badges -->
    <g transform="translate(-180, 0)">
      <rect x="-50" y="-12" width="100" height="24" rx="12" fill="#10b981" opacity="0.2"/>
      <text text-anchor="middle" x="0" y="4" font-family="Arial" font-size="12" font-weight="600" fill="#10b981">
        9 CHAPTERS
      </text>
    </g>
    
    <!-- Center badges -->
    <g transform="translate(0, 0)">
      <rect x="-50" y="-12" width="100" height="24" rx="12" fill="#10b981" opacity="0.2"/>
      <text text-anchor="middle" x="0" y="4" font-family="Arial" font-size="12" font-weight="600" fill="#10b981">
        50+ FRAMEWORKS
      </text>
    </g>
    
    <!-- Right badges -->
    <g transform="translate(180, 0)">
      <rect x="-60" y="-12" width="120" height="24" rx="12" fill="#10b981" opacity="0.2"/>
      <text text-anchor="middle" x="0" y="4" font-family="Arial" font-size="12" font-weight="600" fill="#10b981">
        4 APPENDICES
      </text>
    </g>
  </g>
  
  <!-- Author section -->
  <g transform="translate(300, 800)">
    <text 
      text-anchor="middle" 
      x="0" 
      y="0" 
      font-family="'Helvetica Neue', Arial, sans-serif" 
      font-size="18" 
      font-weight="400" 
      letter-spacing="3"
      fill="#94a3b8">
      BJÖRN 'PWNYTALE' KENNETH HOLMSTRÖM
    </text>
    
    <!-- Version/Date -->
    <text 
      text-anchor="middle" 
      x="0" 
      y="30" 
      font-family="Arial" 
      font-size="12" 
      font-weight="400" 
      fill="#64748b">
      Version 1.0 · February 2026
    </text>
  </g>
  
  <!-- Bottom accent bar -->
  <rect y="892" width="600" height="8" fill="url(#accentGradient)"/>
  
  <!-- Corner accent elements -->
  <g opacity="0.3">
    <!-- Top left corner -->
    <circle cx="40" cy="40" r="3" fill="#10b981"/>
    <circle cx="60" cy="40" r="2" fill="#10b981"/>
    <circle cx="40" cy="60" r="2" fill="#10b981"/>
    
    <!-- Top right corner -->
    <circle cx="560" cy="40" r="3" fill="#10b981"/>
    <circle cx="540" cy="40" r="2" fill="#10b981"/>
    <circle cx="560" cy="60" r="2" fill="#10b981"/>
    
    <!-- Bottom left corner -->
    <circle cx="40" cy="860" r="3" fill="#10b981"/>
    <circle cx="60" cy="860" r="2" fill="#10b981"/>
    <circle cx="40" cy="840" r="2" fill="#10b981"/>
    
    <!-- Bottom right corner -->
    <circle cx="560" cy="860" r="3" fill="#10b981"/>
    <circle cx="540" cy="860" r="2" fill="#10b981"/>
    <circle cx="560" cy="840" r="2" fill="#10b981"/>
  </g>
</svg>
